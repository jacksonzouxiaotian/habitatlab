      FSM w/o heading alignment: "DEGNAV-Rule w/o heading alignment"
      FSM w/o recovery: "DEGNAV-Rule w/o recovery"
      FSM w/o lateral alignment: "DEGNAV-Rule w/o lateral alignment"
      APF+Gap: "APF+Gap classical baseline"
    seeds: "deterministic evaluation over stress grid"
    episodes: "see raw CSV; varies by stress factor and subset"
    metrics:
