version: 2
updated: "2026-09-05"
scope: "AAAI narrow-passage paper result registry"

registry_rules:
  - "status must be one of: canonical, diagnostic, smoke, legacy."
  - "Mixed-split tables are diagnostic or legacy, never canonical."
  - "Cross-domain comparison tables are diagnostic unless a same-split canonical table is generated."
  - "paper_table_formal_baselines.md is a mixed-split Habitat diagnostic comparison because it contains both HM3D Val set A and mined Val set B."
  - "Current DEGNAV-RL results are diagnostic until safe mode selection is reliable."
  - "Smoke baselines are never allowed in the main paper."
  - "The 100.0% DEGNAV-Rule / Geometry-FSM Habitat row means nominal anchor validation under the current mining protocol, not universal robustness."
  - "False-feasible traversal success must not be interpreted as correct rejection without outcome decomposition."
  - "If multiple entries reference the same path, every secondary entry must declare alias_of."
  - "Entries with split_policy: mixed must set canonical: false and paper_safe: false unless they are only raw-data provenance with table_status: missing."

results:
  official_pointnav_mp3d_v1:
    role: canonical_official_reference
    status: canonical
    allowed_in_main_paper: true
    paper_safe: true
    canonical: true
    legacy: false
    diagnostic: false
    path: "examples/narrow_passage_rl/results/official_pointnav_mp3d_v1_20260904/paper_table_official_pointnav.md"
    table_status: available
    split: "official MP3D PointNav v1 val"
    split_policy: same
    source_csvs:
      - "examples/narrow_passage_rl/results/official_pointnav_mp3d_v1_20260904/summary_all_methods.csv"
    table_md: "examples/narrow_passage_rl/results/official_pointnav_mp3d_v1_20260904/paper_table_official_pointnav.md"
    domain: "Habitat official PointNav v1 / MP3D"
    eval_split: "val, 495 fixed official episodes"
    train_domain: "released MP3D checkpoint for PointNav PPO; released Gibson-2+ checkpoint for DD-PPO; not applicable to simple agents"
    methods:
      - "ForwardOnly"
      - "Random Agent"
      - "RandomForward"
      - "GoalFollower"
      - "PointNav PPO"
      - "DD-PPO"
      - "ShortestPathFollower"
    seeds: "3 for stochastic/sampled agents; 1 for deterministic agents"
    episodes: "495 per method and evaluation seed"
    metrics:
      - "success"
      - "spl"
      - "distance_to_goal"
      - "episodes_with_contact"
      - "steps"
    notes:
      - "All available seeds were audited against the same 495 unique (scene_id, episode_id) keys."
      - "DD-PPO is a Gibson-2+-to-MP3D transfer result and must retain that label."
      - "ShortestPathFollower is a privileged NavMesh oracle."
      - "Do not rank these values directly against the custom MP3D-derived narrow-passage protocol."

