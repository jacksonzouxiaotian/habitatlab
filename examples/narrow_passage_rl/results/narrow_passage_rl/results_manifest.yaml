    status: canonical
    allowed_in_main_paper: true
    paper_safe: true
    canonical: true
    legacy: false
    diagnostic: true
    path: "examples/narrow_passage_rl/results/narrow_passage_rl/tables/paper_table_false_feasible_outcomes.md"
