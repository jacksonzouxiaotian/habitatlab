version: 1
updated: "2026-07-17"
scope: "AAAI narrow-passage paper result registry"

registry_rules:
  - "status must be one of: canonical, diagnostic, smoke, legacy."
  - "Mixed-split tables are diagnostic or legacy, never canonical."
  - "Cross-domain comparison tables are diagnostic unless a same-split canonical table is generated."
  - "paper_table_formal_baselines.md is a mixed-split Habitat diagnostic comparison because it contains both HM3D Val set A and mined Val set B."
  - "Current DEGNAV-RL results are diagnostic until safe mode selection is reliable."
  - "Smoke baselines are never allowed in the main paper."
  - "The 100.0% DEGNAV-Rule / Geometry-FSM Habitat row means nominal anchor validation under the current mining protocol, not universal robustness."
  - "False-feasible traversal success must not be interpreted as correct rejection without outcome decomposition."
  - "If multiple entries reference the same path, every secondary entry must declare alias_of."
  - "Entries with split_policy: mixed must set canonical: false and paper_safe: false unless they are only raw-data provenance with table_status: missing."

results:
  procedural_v2_main:
    role: canonical_main
    status: canonical
    allowed_in_main_paper: true
    paper_safe: true
    canonical: true
    legacy: false
    diagnostic: false
    path: "examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_procedural_v2_main.md"
    table_status: available
    split: "synthetic v2 benchmark, held procedural seeds"
    split_policy: same
    source_csvs:
      - "examples/narrow_passage_rl/results/narrow_passage_rl/harder_benchmark_episodes.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/harder_benchmark_summary.csv"
    table_md: "examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_procedural_v2_main.md"
    table_tex: "examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_harder_main.tex"
    raw_csv:
      - "examples/narrow_passage_rl/results/narrow_passage_rl/harder_benchmark_episodes.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/harder_benchmark_summary.csv"
    domain: "Procedural v2 HarderNarrowPassageEnv"
    eval_split: "synthetic v2 benchmark, held procedural seeds"
    train_domain: "none for rule methods; procedural v2 for direct-control RL where included"
    methods:
      - "Geometry-FSM"
      - "Rule baseline"
      - "PPO v2 geometry sensor"
    paper_method_names:
      Geometry-FSM: "DEGNAV-Rule"
      Rule baseline: "Rule baseline"
      PPO v2 geometry sensor: "PPO direct-control baseline"
    seeds: [42, 43, 44]
    episodes: "500 per seed"
    metrics:
      - "success_rate"
      - "collision_rate"
      - "stuck_rate"
      - "steps"
      - "corridor_type_success"
    metric_definitions:
      success_rate: "Fraction of episodes that reach the procedural goal without terminating as failure."
      collision_rate: "Fraction of episodes that report collision through the procedural environment."
      stuck_rate: "Fraction of episodes that terminate due to low progress or stuck detection."
      steps: "Episode length in environment steps."
      corridor_type_success: "Success rate grouped by procedural corridor type."
    notes:
      - "Primary procedural v2 benchmark table for DEGNAV-Rule."
      - "Use this table for synthetic narrow-passage behavior, not for Habitat HM3D claims."

  procedural_v2_ablation:
    role: canonical_ablation
    status: canonical
    allowed_in_main_paper: true
    paper_safe: true
    canonical: true
    legacy: false
    diagnostic: false
    path: "examples/narrow_passage_rl/results/narrow_passage_rl/tables/paper_table_procedural_v2_ablation_core.md"
    table_status: available
    split: "synthetic v2 benchmark, held procedural seeds"
    split_policy: same
    source_csvs:
      - "examples/narrow_passage_rl/results/narrow_passage_rl/raw/procedural_ablation_core.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/raw/procedural_ablation_core_summary.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/tables/procedural_ablation_core_summary.csv"
    table_md: "examples/narrow_passage_rl/results/narrow_passage_rl/tables/paper_table_procedural_v2_ablation_core.md"
    table_tex: "examples/narrow_passage_rl/results/narrow_passage_rl/tables/paper_table_procedural_v2_ablation_core.tex"
    raw_csv:
      - "examples/narrow_passage_rl/results/narrow_passage_rl/raw/procedural_ablation_core.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/raw/procedural_ablation_core_summary.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/tables/procedural_ablation_core_summary.csv"
    domain: "Procedural v2 HarderNarrowPassageEnv"
    eval_split: "synthetic v2 benchmark, held procedural seeds"
    train_domain: "none; rule-controller ablations"
    methods:
      - "DEGNAV full"
      - "w/o alignment"
      - "w/o recovery"
      - "deterministic margin only"
      - "w/o yaw prior"
    paper_method_names:
      DEGNAV full: "DEGNAV-Rule"
      w/o alignment: "DEGNAV-Rule w/o alignment"
      w/o recovery: "DEGNAV-Rule w/o recovery"
      deterministic margin only: "DEGNAV-Rule deterministic margin"
      w/o yaw prior: "DEGNAV-Rule w/o yaw prior"
    seeds: [0, 1, 2]
    episodes: "500 per seed"
    metrics:
      - "success_rate"
      - "collision_rate"
      - "near_collision_rate"
      - "timeout_or_stuck"
      - "correct_reject"
      - "corridor_type_success"
    metric_definitions:
      success_rate: "Fraction of episodes that reach the procedural goal without terminating as failure."
      collision_rate: "Fraction of episodes that report collision through the procedural environment."
      near_collision_rate: "Episode reaches body margin below the near-collision diagnostic threshold."
      timeout_or_stuck: "Episode timed out or reported stuck."
      correct_reject: "Explicit Reject mode on benchmark-labeled false-feasible passages; not inferred from failure."
      corridor_type_success: "Success rate grouped by procedural corridor type."
    notes:
      - "Use this table to support module-level ablations in procedural v2."
      - "This replaces the older entry-jitter-only paper_table_harder_ablation.md as the paper-facing core ablation table."
      - "False-feasible traversal success is reported separately from correct rejection."

  false_feasible_outcome_decomposition:
