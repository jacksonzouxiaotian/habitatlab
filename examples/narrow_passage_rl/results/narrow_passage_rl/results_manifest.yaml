      - "collision_rate"
      - "difficulty_bin_success"
    metric_definitions:
      nominal_success_rate: "Habitat goal-reaching success, not clearance-aware strict success."
      collision_rate: "Habitat collision flag."
      difficulty_bin_success: "Success rate grouped by narrow, normal, and wide body-margin bins."
    notes:
