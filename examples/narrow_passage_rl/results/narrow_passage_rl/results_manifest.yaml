      - "examples/narrow_passage_rl/results/degnav_e2e_mp3d_narrow_v1_20260904/knn_memory_19d_episodes.csv"
      - "examples/narrow_passage_rl/results/degnav_e2e_mp3d_narrow_v1_20260904/degnav_memory_19d_episodes.csv"
      - "examples/narrow_passage_rl/results/degnav_e2e_mp3d_narrow_v1_20260904/summary_by_seed.csv"
    table_md: "examples/narrow_passage_rl/results/formal_mp3d_summary_20260905/final_method_status.md"
    domain: "Custom narrow-passage episodes mined from official MP3D scans"
    eval_split: "80 MP3D-val-derived episodes, 64 feasible and 16 candidate-infeasible"
    train_domain: "400 MP3D-train-derived teacher episodes for DEGNAV-E2E; no training for deterministic 19D rows"
    methods:
      - "Geometry-19D / no-memory"
      - "episodic kNN memory-19D"
      - "DEGNAV memory-19D"
      - "DEGNAV-E2E (Depth, offline BC)"
    seeds:
      deterministic_19d: [1701]
      degnav_e2e: [1701, 1702, 1703]
    episodes: "80 fixed validation episodes per method/seed"
    metrics:
      - "all_success"
      - "feasible_success"
      - "candidate_infeasible_traversal"
      - "decision_accuracy"
      - "correct_reject"
      - "false_reject"
      - "collision"
      - "timeout"
      - "steps"
    notes:
      - "This is not the official Habitat PointNav benchmark."
      - "DEGNAV-E2E is offline behavior cloning and outputs high-level modes to a fixed low-level controller."
      - "E2E checkpoint selection uses teacher labels from the same scene-disjoint validation corpus; describe this as validation rather than an independent test."
      - "Candidate-infeasible is a generator label, not a collision-certified impossibility proof."
      - "Recover appears in only one of 240 E2E seed-episodes, so reliable recovery is not established."

