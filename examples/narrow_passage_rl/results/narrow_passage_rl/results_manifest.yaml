      - "examples/narrow_passage_rl/results/narrow_passage_rl/habitat_apf_gap_episodes.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/habitat_fsm_v2_episodes.csv"
      - "examples/narrow_passage_rl/results/narrow_passage_rl/habitat_memory_v2_episodes.csv"
    domain: "Habitat HM3D NarrowPassageNav-v0"
    eval_split: "Val set A, 157 episodes, 20 held-out HM3D val scenes"
    train_domain: "synthetic v2 for PPO; none for APF+Gap and rule controllers"
    methods:
      - "PPO v2 geometry sensor"
      - "APF+Gap"
      - "Geometry-FSM"
      - "FSM + Failure Memory"
    paper_method_names:
      PPO v2 geometry sensor: "PPO direct-control baseline"
      APF+Gap: "APF+Gap classical baseline"
      Geometry-FSM: "DEGNAV-Rule"
      FSM + Failure Memory: "DEGNAV-Rule + failure memory"
    seeds:
      PPO v2 geometry sensor: [0, 1, 2]
      APF+Gap: "deterministic"
      Geometry-FSM: "deterministic"
      FSM + Failure Memory: "deterministic"
    episodes: 157
    metrics:
      - "nominal_success_rate"
      - "collision_rate"
      - "difficulty_bin_success"
    metric_definitions:
      nominal_success_rate: "NarrowPassageNav-v0 goal-reaching success under unperturbed mined anchors."
      collision_rate: "Habitat collision flag; with allow_sliding=False this may undercount boundary contact."
      difficulty_bin_success: "Success rate grouped by narrow, normal, and wide body-margin bins."
    notes:
      - "This entry is the same-split Habitat nominal anchor-validation table."
      - "All included rows use the same 157 HM3D Val set A episode IDs."
      - "Success and steps are the fair all-method comparison metrics available in every source CSV."
      - "Collision and near-collision are not logged for PPO/APF+Gap in these source CSVs, so those diagnostic columns are not used for all-method ranking."
      - "The 100.0% DEGNAV-Rule / Geometry-FSM row is nominal anchor validation under the current mining protocol, not universal robustness."
      - "Failure memory is not expected to improve one-shot passable-anchor success; cite repeated-failure memory experiments for the memory contribution."

