      correct_reject: "reject and passable_label == false; never inferred from success == false."
      false_reject: "reject and passable_label == true."
      collision: "Procedural collision flag accumulated over the episode."
      near_collision: "Episode reaches body margin below the near-collision threshold."
      timeout_or_stuck: "Episode timed out or ended with stuck flag."
      wasted_attempt: "Attempted execution on a false-feasible passage without correct rejection."
    notes:
      - "0% traversal success is not equivalent to correct rejection; this table decomposes abstention and execution failure."
      - "The current Reactive rule baseline and DEGNAV-Rule / Geometry-FSM both have 0.0% correct reject on this labeled false-feasible slice."
      - "Use this table to avoid overclaiming Reject-mode evidence from the aggregate false-feasible success column."

