      - "Clearance columns are diagnostic body-margin proxies, not calibrated physical contact measurements."

  habitat_clearance_diagnostic:
    role: diagnostic
    status: diagnostic
    allowed_in_main_paper: true
    paper_safe: true
    canonical: false
    legacy: false
    diagnostic: true
    path: "examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_diagnostic_baselines.md"
