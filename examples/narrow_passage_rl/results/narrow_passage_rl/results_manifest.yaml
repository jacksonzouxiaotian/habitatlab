      collision_rate: "Habitat collision flag."
      avg_steps: "Mean episode length."
      timeout_rate: "Fraction of episodes ending due to max-step timeout."
    notes:
      - "Primary Habitat robustness evidence beyond nominal anchors."
      - "Use this table to discuss module sensitivity under Habitat perturbations."
      - "Clearance-aware strict success, near-collision, and min-clearance metrics are split into habitat_stress_clearance_diagnostic."

  habitat_stress_clearance_diagnostic:
