    eval_split: "HM3D val mined anchors with yaw, lateral offset, dropout, noise, and extreme-narrow filters"
    train_domain: "none for rule-controller variants; APF+Gap has no learning"
    methods:
      - "Full Geometry-FSM"
      - "FSM w/o heading alignment"
      - "FSM w/o recovery"
      - "FSM w/o lateral alignment"
      - "APF+Gap"
    metrics:
      - "strict_success_rate"
      - "near_collision_rate"
      - "avg_min_clearance"
      - "success_but_unsafe_rate"
    metric_definitions:
      strict_success_rate: "Depth-derived body-margin diagnostic success, not a calibrated contact measurement."
      near_collision_rate: "Fraction of episodes with min clearance below the near-collision threshold."
      avg_min_clearance: "Mean minimum depth-derived body-margin proxy."
      success_but_unsafe_rate: "Nominal success with failed clearance-aware strict diagnostic."
    notes:
      - "The strict clearance metric is a depth-derived body-margin proxy."
      - "Negative values and high near-collision rates may reflect scanned-scene, navmesh, or depth-proxy artifacts."
      - "Report as diagnostic indicators, not direct physical contact measurements."

