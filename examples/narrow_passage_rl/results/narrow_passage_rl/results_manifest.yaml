    diagnostic: true
    path: "examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_degnav_rl_diagnostic.md"
    table_status: available
    split: "synthetic v2 procedural evaluation"
    split_policy: same
    source_csvs:
