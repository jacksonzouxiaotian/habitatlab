      strict_success_rate: "Nominal success with clearance-aware strict success and no collision/stuck."
      clearance_safe_rate: "Fraction of episodes whose minimum clearance satisfies the strict threshold."
      success_but_unsafe: "Nominal success that fails strict clearance safety."
      collision_rate: "Habitat collision flag."
      near_collision_rate: "Fraction of episodes with min clearance below near-collision threshold."
      avg_min_clearance: "Mean minimum clearance across episodes."
    notes:
      - "Diagnostic evidence that nominal success alone can be exploited by direct-control RL."
      - "Habitat clearance metrics are depth-derived body-margin diagnostics, not calibrated contact measurements."
