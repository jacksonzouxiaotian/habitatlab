      - "examples/narrow_passage_rl/results/narrow_passage_rl/habitat_td3_habitat_native_strict_eval.csv"
    domain: "Habitat HM3D NarrowPassageNav-v0"
    eval_split: "Mined Val set B, 151 episodes"
    train_domain: "Habitat HM3D mined Val set B"
    methods:
      - "TD3 Habitat-native"
    paper_method_names:
      TD3 Habitat-native: "TD3 direct-control diagnostic"
    seeds: [0]
    episodes: 151
    metrics:
