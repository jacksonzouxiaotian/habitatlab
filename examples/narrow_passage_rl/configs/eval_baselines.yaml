# Baseline evaluation protocol.
experiment: eval_narrow_passage_baselines
script: examples/narrow_passage_rl/narrow_passage/scripts/evaluate.py

datasets:
  synthetic_v2:
    episodes: 500
    seeds: [0, 1, 2]
    scenario_types:
      - Straight Passage
      - Angled Entrance
      - Asymmetric Obstacles
      - Multi-Passage Choice
    width_body_ratios: [0.70, 0.75, 0.85, 0.95, 1.10]
  habitat_hm3d:
    data_path: data/datasets/narrow_passage/{split}/{split}.json.gz
    splits: [val, extreme_narrow]

baseline_layers:
  traditional_planning:
    purpose: "Show that common robot navigation stacks hesitate/fail near narrow-passage boundaries."
    methods:
      - dwb
      - teb
      - rpp
      - mppi
      - smac_hybrid_astar
  learning_navigation:
    purpose: "Show that ordinary RL/IL is insufficient without explicit failure memory."
    methods:
      - ppo_depth
      - ppo_geometry
      - recurrent_ppo
      - geometry_recurrent_ppo
      - sac_geometry
      - td3_geometry
      - bc_dagger
  memory_history:
    purpose: "Show that generic history or memory is not the same as geometry-guided failure memory."
    methods:
      - gru_ppo
      - knn_failure_memory
      - replay_memory_policy
      - transformer_history
      - vanilla_episodic_memory
      - geometry_guided_failure_memory
  recent_strong_navigation:
    purpose: "Respond to modern visual/semantic/diffusion navigation baselines without overclaiming full reproduction."
    methods:
      - viplanner_style
      - nomad_style
      - vint_gnm_style
      - hierarchical_legged_rl
      - privileged_geometry_rl

ours_ablation:
  - ours_no_geometry
  - ours_no_memory
  - ours_no_risk
  - ours_no_recovery
  - ours_full

implementation_policy:
  direct_habitatlab:
    - ppo_depth
    - ppo_geometry
    - recurrent_ppo
    - sac_geometry
    - td3_geometry
    - bc_dagger
    - knn_failure_memory
    - vanilla_episodic_memory
    - transformer_history
    - viplanner_style
    - nomad_style
  ros2_nav2_adapter:
    - dwb
    - rpp
    - mppi
    - smac_hybrid_astar
  external_or_optional:
    - teb
    - vint_gnm_style

reward_protocol:
  learning_baselines_default: fair
  wrapper: examples/narrow_passage_rl/fair_reward_wrapper.py
  rationale: >
    Clip open-space clearance reward and penalize timeout/no-progress behavior
    so PPO/SAC/TD3/RecurrentPPO/ReplayMemoryPolicy cannot obtain high return by
    staying outside the passage.
  legacy_reproduction: "Pass --reward-mode native to reproduce older native-v2 reward runs."

metrics:
  - success_rate
  - collision_rate
  - near_collision_rate
  - oscillation_count
  - stuck_rate
  - recovery_success
  - min_clearance
  - time_to_goal
  - spl
  - repeated_failure_rate

paper_tables:
  main_table:
    - traditional_planning
    - learning_navigation
    - memory_history
    - ours_full
  appendix_table:
    - recent_strong_navigation

current_result_artifacts:
  memory_history:
    script: examples/narrow_passage_rl/eval_memory_baselines.py
    table: examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_memory_baselines.md
    raw: examples/narrow_passage_rl/results/narrow_passage_rl/memory_baselines.csv
    evaluated:
      - knn_failure_memory
      - vanilla_episodic_memory
      - geometry_guided_failure_memory
  learning_navigation:
    table: examples/narrow_passage_rl/results/narrow_passage_rl/paper_table_learning_baselines.md
    evaluated:
      - ppo_geometry
      - sac_geometry
      - recurrent_ppo_lightweight
      - sb3_contrib_recurrent_ppo_smoke
      - bc_fsm_smoke
      - dagger_fsm_smoke
      - replay_memory_policy_smoke
    pending_full_runs:
      - td3_geometry
      - sb3_contrib_recurrent_ppo_long
      - bc_dagger_long
      - replay_memory_policy_long
