# Ablation protocol for paper Table: module contribution.
experiment: eval_narrow_passage_ablation
script: examples/narrow_passage_rl/narrow_passage/scripts/run_ablation.py

variants:
  ours_full:
    geometry: true
    memory: true
    risk_head: true
    recovery: true
  ours_no_memory:
    geometry: true
    memory: false
    risk_head: true
    recovery: true
  ours_no_geometry:
    geometry: false
    memory: true
    risk_head: true
    recovery: true
  ours_no_risk:
    geometry: true
    memory: true
    risk_head: false
    recovery: true
  ours_no_recovery:
    geometry: true
    memory: true
    risk_head: true
    recovery: false

habitat_stress_tests:
  unperturbed_mined_val:
    split: val
    heading_perturb_deg: [0]
    lateral_perturb_m: [0.0]
    start_distance_shift_m: [0.0]
    feature_noise_std: [0.0]
    depth_dropout_prob: [0.0]
    max_steps: 500
    status: completed
  yaw_perturbation:
    split: extreme_narrow
    heading_perturb_deg: [-90, -60, -30, 30, 60, 90]
    lateral_perturb_m: [0.0]
    start_distance_shift_m: [0.0]
    feature_noise_std: [0.0]
    depth_dropout_prob: [0.0]
    max_steps: 500
    status: implemented
  lateral_offset:
    split: extreme_narrow
    heading_perturb_deg: [0]
    lateral_perturb_m: [-0.3, -0.2, -0.1, 0.1, 0.2, 0.3]
    start_distance_shift_m: [0.0]
    feature_noise_std: [0.0]
    depth_dropout_prob: [0.0]
    max_steps: 500
    status: implemented
  start_distance:
    split: extreme_narrow
    heading_perturb_deg: [0]
    lateral_perturb_m: [0.0]
    # Positive values move the reset pose closer to the goal; negative values
    # move it farther from the entrance.
    start_distance_shift_m: [-1.0, -0.5, 0.5, 1.0]
    feature_noise_std: [0.0]
    depth_dropout_prob: [0.0]
    max_steps: 500
    status: implemented
  depth_noise:
    split: extreme_narrow
    heading_perturb_deg: [0]
    lateral_perturb_m: [0.0]
    start_distance_shift_m: [0.0]
    feature_noise_std: [0.01, 0.03, 0.05]
    depth_dropout_prob: [0.05, 0.10, 0.20]
    max_steps: 500
    status: implemented_feature_level
  extreme_narrow:
    split: extreme_narrow
    body_margin_lt_m: 0.05
    max_steps: 500
    status: completed
  planned_goal_perturbation:
    split: extreme_narrow
    goal_offset_m: [0.1, 0.2, 0.3]
    status: planned_dataset_regeneration
  planned_false_feasible:
    split: false_feasible
    status: planned_anchor_mining
  planned_dynamic_obstacle:
    split: stress_dynamic
    obstacle_model: temporary_blocker_or_pedestrian_proxy
    status: planned_sim_extension
  planned_scene_generalization:
    split: hm3d_test_or_unseen_val_rooms
    status: planned_dataset_split

metrics:
  primary: [success_rate, repeated_failure_rate]
  safety: [collision_rate, near_collision_rate, min_clearance]
  behavior: [oscillation_count, stuck_rate, recovery_success, time_to_goal]
