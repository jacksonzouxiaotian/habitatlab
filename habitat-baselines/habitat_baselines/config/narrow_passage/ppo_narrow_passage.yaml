# @package _global_

# Smoke-test Habitat config for the narrow-passage task components. For the
# first real paper curves, use examples/narrow_passage_rl/train_sb3.py because
# it exposes a clean Box([vx, wz]) action space.

defaults:
  - /benchmark/nav/pointnav: pointnav_habitat_test
  - override /habitat/task: narrow_passage
  - /habitat_baselines: habitat_baselines_rl_config_base
  - _self_

habitat:
  environment:
    max_episode_steps: 300
  dataset:
    type: PointNav-v1
    split: train
    data_path: data/datasets/narrow_passage/{split}/{split}.json.gz
  simulator:
    allow_sliding: False
    agents:
      main_agent:
        sim_sensors:
          depth_sensor:
            width: 128
            height: 128

habitat_baselines:
  trainer_name: "ppo"
  torch_gpu_id: 0
  tensorboard_dir: "tb/narrow_passage_habitat"
  video_dir: "video_dir/narrow_passage_habitat"
  test_episode_count: 20
  eval_ckpt_path_dir: "data/narrow_passage_checkpoints"
  num_environments: 1
  checkpoint_folder: "data/narrow_passage_checkpoints"
  total_num_steps: 1e6
  num_updates: -1
  log_interval: 10
  num_checkpoints: 20
  force_torch_single_threaded: True

  rl:
    policy:
      main_agent:
        name: "NarrowPassagePolicy"
        action_distribution_type: "categorical"

    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 1
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 64
      hidden_size: 256
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: True
      use_linear_lr_decay: True
      reward_window_size: 50
