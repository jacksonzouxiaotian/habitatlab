# @package _global_

defaults:
  - ppo_narrow_passage
  - _self_

habitat:
  environment:
    max_episode_steps: 200

habitat_baselines:
  tensorboard_dir: "tb/narrow_passage_habitat_debug"
  video_dir: "video_dir/narrow_passage_habitat_debug"
  test_episode_count: 10
  eval_ckpt_path_dir: "data/narrow_passage_checkpoints_debug"
  num_environments: 2
  checkpoint_folder: "data/narrow_passage_checkpoints_debug"
  total_num_steps: 2.0e5
  log_interval: 1
  num_checkpoints: -1
  checkpoint_interval: 10

  rl:
    policy:
      main_agent:
        use_recurrent: False
        use_geometry_features: True
        use_clearance_features: True
        use_risk_features: True

    ppo:
      clip_param: 0.15
      ppo_epoch: 2
      num_mini_batch: 1
      value_loss_coef: 0.75
      entropy_coef: 0.02
      lr: 2.5e-4
      max_grad_norm: 0.5
      num_steps: 64
      gamma: 0.98
      tau: 0.92
      reward_window_size: 20
